name: Fetch generated images
on:
  push:
    paths: [".github/image-sources/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          sudo apt-get install -y -qq webp >/dev/null
          mkdir -p site/images/src
          cat .github/image-sources/*.txt | while read -r name url; do
            [ -z "$name" ] && continue
            [ -f "site/images/src/$name.png" ] && continue
            curl -fsSL "$url" -o "site/images/src/$name.png"
          done
          ls -la site/images/src
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/images/src
          git diff --cached --quiet || git commit -m "Add generated atelier images"
          git push
